name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pybind11
        run: pip install pybind11

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLATTICE_BUILD_TESTS=ON \
            -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pybind11 numpy

      - name: Configure and build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR=$(python -m pybind11 --cmakedir)
          cmake --build build -j$(nproc)

      - name: Cache SIFT small dataset
        id: cache-sift
        uses: actions/cache@v4
        with:
          path: bench/data/siftsmall
          key: siftsmall-v1

      - name: Download SIFT small
        if: steps.cache-sift.outputs.cache-hit != 'true'
        working-directory: bench/data
        run: |
          curl -O ftp://ftp.irisa.fr/local/texmex/corpus/siftsmall.tar.gz
          tar -xzf siftsmall.tar.gz

      - name: Run benchmark
        working-directory: bench
        run: python run.py --skip qdrant,chroma --json current.json

      - name: Check for regression
        working-directory: bench
        run: python check_regression.py --current current.json

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lcov

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pybind11
        run: pip install pybind11

      - name: Configure with coverage
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLATTICE_BUILD_TESTS=ON \
            -DLATTICE_COVERAGE=ON \
            -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build and test
        run: |
          cmake --build build -j$(nproc)
          cd build && ctest --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch,gcov
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' \
            --output-file coverage.info
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false