[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pylattice-db"
version = "0.1.3"
description = "An embedded vector database with a from-scratch HNSW index"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aman Karki" }]
keywords = ["vector-database", "hnsw", "similarity-search", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/amankarki151/lattice"
Repository = "https://github.com/amankarki151/lattice"

[tool.scikit-build]
cmake.version = ">=3.20"
# The whole project builds - core, cli, bindings - but only the
# compiled Python extension module actually needs to ship in the
# wheel. wheel.packages stays empty; the extension module itself
# gets picked up by scikit-build-core automatically because
# pybind11_add_module's output is installed via cmake --install.
wheel.packages = []

# Only build the pieces the wheel actually needs. Skipping the CLI
# and test suite keeps the wheel build fast and avoids needing
# GoogleTest fetched during packaging.
cmake.args = ["-DLATTICE_BUILD_TESTS=OFF"]